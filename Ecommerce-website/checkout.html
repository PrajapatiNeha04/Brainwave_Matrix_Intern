<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page Title - ShopEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header>
    <nav class="navbar">
      <div class="logo">ShopEase</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="cart.html" class="cart-btn">🛒 Cart (<span id="cartItemCount">0</span>)</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main>
<section class="checkout-container">
  <h2>Checkout</h2>
  <form class="checkout-form" onsubmit="return handleCheckout(event)">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" required>
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" required>
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" required>
    </div>
    <div class="form-group">
      <label>Shipping Address</label>
      <textarea rows="1" required></textarea>
    </div>
    <div class="form-group">
      <label>Payment Method</label>
      <select required>
        <option value="">Select</option>
        <option value="COD">Cash on Delivery</option>
        <option value="Card">Credit/Debit Card</option>
      </select>
    </div>

    <button type="submit" class="checkout-btn">Place Order</button>
  </form>
</section>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 ShopEase. Crafted with ❤️ for shopaholics everywhere.</p>
  </footer>

  <!-- Script -->
  <script src="script.js"></script>

</body>
</html>
